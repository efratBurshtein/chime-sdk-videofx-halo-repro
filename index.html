<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chime SDK Background Filter: 1.0 vs 2.0 Edge Quality Comparison</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f1117; color: #e4e8ee; }
      .container { max-width: 1040px; margin: 0 auto; padding: 20px; }

      h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
      .subtitle { font-size: 13px; color: #8b95a5; margin: 0 0 16px; }
      h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #8b95a5; margin: 18px 0 6px; }

      .video-stage {
        position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9;
        background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #1e2330;
      }
      .video-stage video {
        width: 100%; height: 100%; object-fit: cover;
        transform: rotateY(180deg); display: block;
      }

      .status-badge {
        display: inline-block; font-size: 12px; font-weight: 500;
        padding: 3px 10px; border-radius: 999px; background: #1a1f2e; color: #8b95a5;
        margin-bottom: 12px;
      }

      .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
      .btn {
        border: none; border-radius: 6px; padding: 8px 16px;
        font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s;
      }
      .btn:hover { opacity: .85; }
      .btn:disabled { opacity: .4; cursor: default; }
      .btn-v2 { background: #22c55e; color: #052e16; }
      .btn-v1 { background: #f59e0b; color: #451a03; }
      .btn-neutral { background: #2a3042; color: #c8d0de; }

      .settings { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
      .settings label { font-size: 13px; color: #8b95a5; }
      .settings select {
        background: #1a1f2e; color: #e4e8ee; border: 1px solid #2a3042;
        border-radius: 4px; padding: 4px 8px; font-size: 13px;
      }

      .log-panel {
        white-space: pre-wrap; background: #0a0c12; border: 1px solid #1e2330;
        border-radius: 6px; padding: 10px; margin-top: 14px; height: 160px;
        overflow-y: auto; font-family: 'SF Mono', ui-monospace, monospace; font-size: 11px;
        color: #8b95a5; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Background Filter Edge Quality: 1.0 vs 2.0</h1>
      <p class="subtitle">
        Isolated comparison &mdash; no meeting session, no application framework.
        Same camera, same SDK build (<code>amazon-chime-sdk-js@3.32.0</code>).
      </p>
      <span class="status-badge" id="status">Initializing&hellip;</span>

      <div class="video-stage">
        <video id="preview" autoplay playsinline muted></video>
      </div>

      <h2>Background Filter 2.0 &mdash; VideoFxProcessor</h2>
      <div class="btn-group">
        <button class="btn btn-neutral" id="btn-none">None (raw camera)</button>
        <button class="btn btn-v2" id="btn-blur2">Blur 2.0</button>
        <button class="btn btn-v2" id="btn-image2-bg1">Replacement 2.0 (image A)</button>
        <button class="btn btn-v2" id="btn-image2-resp">Replacement 2.0 (image B)</button>
        <button class="btn btn-v2" id="btn-color2">Replacement 2.0 (solid green)</button>
      </div>

      <h2>Background Filter 1.0 &mdash; Legacy Processors</h2>
      <div class="btn-group">
        <button class="btn btn-v1" id="btn-blur1">Blur 1.0</button>
        <button class="btn btn-v1" id="btn-image1-bg1">Replacement 1.0 (image A)</button>
        <button class="btn btn-v1" id="btn-image1-resp">Replacement 1.0 (image B)</button>
      </div>

      <h2>Device Settings</h2>
      <div class="settings">
        <label>Camera
          <select id="camera-select"></select>
        </label>
        <label>Blur strength (2.0 only)
          <select id="blur-strength">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high" selected>High</option>
          </select>
        </label>
        <label>Requested resolution
          <select id="resolution">
            <option value="">Browser default</option>
            <option value="640x360">640 &times; 360</option>
            <option value="960x540" selected>960 &times; 540</option>
            <option value="1280x720">1280 &times; 720</option>
            <option value="1920x1080">1920 &times; 1080</option>
          </select>
        </label>
        <label>Processing budget / frame (2.0 only)
          <select id="processing-budget">
            <option value="" selected>Default (50)</option>
            <option value="50">50</option>
            <option value="80">80</option>
            <option value="100">100</option>
          </select>
        </label>
        <button class="btn btn-neutral" id="btn-apply-settings">Apply camera / resolution</button>
      </div>

      <div class="log-panel" id="log" role="log" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
